name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # ── macOS: Universal binary (arm64 + amd64) with location helper ────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.0'

    - name: Build binaries (macOS Universal)
      run: |
        make build-universal
        tar -czf time-tracker-darwin-universal.tar.gz -C bin time-tracker time-tracker-location.app

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          time-tracker-darwin-universal.tar.gz
          scripts/setup.sh

  # ── Linux: amd64 + arm64 ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.0'

    - name: Build Linux amd64
      run: make build-linux

    - name: Build Linux arm64
      run: make build-linux-arm64

    - name: Package Linux binaries
      run: |
        # Package amd64
        STAGE_AMD64=$(mktemp -d)
        cp bin/time-tracker-linux-amd64 "$STAGE_AMD64/"
        cp bin/time-tracker-location-linux-amd64 "$STAGE_AMD64/"
        mkdir -p "$STAGE_AMD64/systemd" "$STAGE_AMD64/scripts"
        cp systemd/time-tracker.service "$STAGE_AMD64/systemd/"
        cp scripts/install-linux.sh scripts/uninstall-linux.sh "$STAGE_AMD64/scripts/"
        tar -czf time-tracker-linux-amd64.tar.gz -C "$STAGE_AMD64" .
        rm -rf "$STAGE_AMD64"

        # Package arm64
        STAGE_ARM64=$(mktemp -d)
        cp bin/time-tracker-linux-arm64 "$STAGE_ARM64/"
        cp bin/time-tracker-location-linux-arm64 "$STAGE_ARM64/"
        mkdir -p "$STAGE_ARM64/systemd" "$STAGE_ARM64/scripts"
        cp systemd/time-tracker.service "$STAGE_ARM64/systemd/"
        cp scripts/install-linux.sh scripts/uninstall-linux.sh "$STAGE_ARM64/scripts/"
        tar -czf time-tracker-linux-arm64.tar.gz -C "$STAGE_ARM64" .
        rm -rf "$STAGE_ARM64"

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          time-tracker-linux-amd64.tar.gz
          time-tracker-linux-arm64.tar.gz
          scripts/setup-linux.sh

  # ── Windows: amd64 + arm64 ──────────────────────────────────────────────────
  build-windows:
    runs-on: ubuntu-latest  # Cross-compile from Linux (no CGo needed)
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.0'

    - name: Build Windows amd64
      run: make build-windows

    - name: Build Windows arm64
      run: make build-windows-arm64

    - name: Package Windows binaries
      run: |
        cd bin
        zip ../time-tracker-windows-amd64.zip time-tracker-windows-amd64.exe time-tracker-location-windows-amd64.exe
        zip ../time-tracker-windows-arm64.zip time-tracker-windows-arm64.exe time-tracker-location-windows-arm64.exe
        cd ..
        # Add install scripts to the zip files
        zip time-tracker-windows-amd64.zip scripts/install-windows.ps1 scripts/uninstall-windows.ps1
        zip time-tracker-windows-arm64.zip scripts/install-windows.ps1 scripts/uninstall-windows.ps1

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          time-tracker-windows-amd64.zip
          time-tracker-windows-arm64.zip
          scripts/setup.ps1

  # ── Create GitHub Release with all platform binaries ────────────────────────
  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Flatten setup scripts
      run: |
        # Move setup scripts from scripts/ to root so release asset names
        # match the download URLs (e.g. setup.ps1, not scripts/setup.ps1)
        cp scripts/setup.sh setup.sh 2>/dev/null || true
        cp scripts/setup.ps1 setup.ps1 2>/dev/null || true
        cp scripts/setup-linux.sh setup-linux.sh 2>/dev/null || true
        ls -la

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          time-tracker-darwin-universal.tar.gz
          time-tracker-linux-amd64.tar.gz
          time-tracker-linux-arm64.tar.gz
          time-tracker-windows-amd64.zip
          time-tracker-windows-arm64.zip
          setup.sh
          setup.ps1
          setup-linux.sh
        draft: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
